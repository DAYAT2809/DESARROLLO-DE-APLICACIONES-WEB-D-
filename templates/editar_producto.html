{% extends "base.html" %}

{% block title %}Editar Producto - Girls{% endblock %}

{% block content %}

<section class="container my-5">

    <h1 class="text-center mb-4" style="color:#c44a87;">
        Editar Producto
    </h1>

    <div class="card shadow-sm mx-auto" style="max-width: 600px;">

        <div class="card-body">

            <form method="POST">

                <!-- NOMBRE -->

                <div class="mb-3">

                    <label class="form-label">
                        Nombre
                    </label>

                    <input
                        type="text"
                        name="nombre"
                        class="form-control"
                        value="{{ producto.nombre }}"
                        required>

                </div>


                <!-- DESCRIPCIÓN -->

                <div class="mb-3">

                    <label class="form-label">
                        Descripción
                    </label>

                    <input
                        type="text"
                        name="descripcion"
                        class="form-control"
                        value="{{ producto.descripcion }}"
                        required>

                </div>


                <!-- PRECIO -->

                <div class="mb-3">

                    <label class="form-label">
                        Precio
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        name="precio"
                        class="form-control"
                        value="{{ producto.precio }}"
                        required>

                </div>


                <!-- STOCK -->

                <div class="mb-3">

                    <label class="form-label">
                        Stock
                    </label>

                    <input
                        type="number"
                        name="stock"
                        class="form-control"
                        value="{{ producto.stock }}"
                        required>

                </div>


                <!-- PROVEEDOR -->

                <div class="mb-3">

                    <label class="form-label">
                        Proveedor
                    </label>

                    <select
                        name="id_proveedor"
                        class="form-select"
                        required>

                        {% for proveedor in proveedores %}

                            <option
                                value="{{ proveedor.id_proveedor }}"
                                {% if proveedor.id_proveedor == producto.id_proveedor %}
                                    selected
                                {% endif %}>

                                {{ proveedor.nombre }} - {{ proveedor.empresa }}

                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- BOTÓN GUARDAR -->

                <button
                    type="submit"
                    class="btn btn-primary w-100">

                    Guardar cambios

                </button>


                <!-- CANCELAR -->

                <a
                    href="/productos"
                    class="btn btn-secondary w-100 mt-2">

                    Cancelar

                </a>

            </form>

        </div>

    </div>

</section>

{% endblock %}

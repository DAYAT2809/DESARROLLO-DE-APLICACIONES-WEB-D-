{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2 class="mb-4">Editar Usuario</h2>

    <div class="card">
        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Usuario</label>

                    <input
                        type="text"
                        name="usuario"
                        value="{{ usuario.usuario }}"
                        class="form-control"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Nueva contraseña
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Dejar vacío para conservar la actual"
                    >
                </div>

                <button type="submit" class="btn btn-primary">
                    Guardar cambios
                </button>

                <a href="{{ url_for('usuarios') }}"
                   class="btn btn-secondary">
                    Cancelar
                </a>

            </form>

        </div>
    </div>

</div>

{% endblock %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Girls{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS del proyecto -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- ENCABEZADO Y MENÚ -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">

                <a class="navbar-brand" href="{{ url_for('inicio') }}">
                    Girls
                </a>

                <button class="navbar-toggler" type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menu">

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('inicio') }}">
                                Inicio
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('productos') }}">
                                Productos
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('clientes') }}">
                                Clientes
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('proveedores') }}">
                                Proveedores
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('facturacion') }}">
                                Facturación
                            </a>
                        </li>

                    </ul>

                </div>
            </div>
        </nav>
    </header>


    <!-- CONTENIDO DE CADA PÁGINA -->
    <main>
        {% block content %}
        {% endblock %}
    </main>


    <!-- PIE DE PÁGINA -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">
            Girls - Desarrollo de Aplicaciones Web - 2026
        </p>
    </footer>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript del proyecto -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
